[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-toc-cli"
version = "0.1.0"
description = "Generate and verify a table of contents for Markdown files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["markdown", "toc", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]

[project.scripts]
markdown-toc = "markdown_toc.__main__:main"

[tool.setuptools.packages.find]
include = ["markdown_toc*"]
